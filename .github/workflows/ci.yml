name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Installer les dépendances du projet
        run: python -m venv .venv && . .venv/bin/activate && pip install pandas==2.2.* scikit-learn==1.5.* joblib==1.4.* fastapi==0.115.* uvicorn[standard]==0.30.* pydantic==2.9.* pytest==8.3.* httpx==0.27.* streamlit==1.39.* python-dotenv==1.0.*
      - name: Produire les données et entraîner le modèle
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Tests Python
        run: . .venv/bin/activate && pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node --test web/client.test.mjs
