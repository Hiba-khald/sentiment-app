name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Installer les dépendances
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[test]"
          pip install "pandas==2.2.*" "fastapi==0.115.*" "uvicorn[standard]==0.30.*" "pydantic==2.9.*" "httpx==0.27.*" "streamlit==1.39.*" "python-dotenv==1.0.*"
      - name: Produire les données et le modèle
        run: |
          . .venv/bin/activate
          python src/make_demo.py
          python src/train.py
      - name: Tests
        run: |
          . .venv/bin/activate
          pytest -q

  paquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Construire le paquet
        run: |
          python -m pip install build
          python -m build
      - name: Vérifier l'installation du paquet
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import sentiment_app; print('OK')"