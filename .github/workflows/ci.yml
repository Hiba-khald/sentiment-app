name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Installer les dépendances
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install "pandas==2.2.*" "scikit-learn==1.5.*" "joblib==1.4.*" "fastapi==0.115.*" "uvicorn[standard]==0.30.*" "pydantic==2.9.*" "httpx==0.27.*" "streamlit==1.39.*" "python-dotenv==1.0.*" "pytest==8.3.*"
      - name: Produire les données et le modèle
        run: |
          . .venv/bin/activate
          python src/make_demo.py
          python src/train.py
      - name: Tests
        run: |
          . .venv/bin/activate
          pytest -q